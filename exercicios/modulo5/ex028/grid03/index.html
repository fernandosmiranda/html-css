<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout na Prática</title>
    <style>
        div.container{
            border: 3px solid blue;
            display: grid;
            grid-template-rows: 80px 80px 80px;
            grid-template-columns: 1fr 2fr 1fr;
            
            /* Fazendo dessa forma, somente 9 itens terão a configuração acima de rows e columns */
            /* Para que novos itens "herdem" as configurações é necessário a declaração abaixo */

            grid-auto-flow: row; /* Por padrão o valor é row. Com o valor row os novos itens serão
                                       Dispostos em linhas. Com o valor column os novos itens serão 
                                       dispostos em colunas. */
            
            grid-auto-rows: 80px;
            grid-auto-columns: 120px;

            gap: 10px;
            place-items: normal normal;
            place-content: normal normal;        
        }

        div.item{
            border: 3px solid red;
            padding: 5px;

        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>
        <div class="item">I</div>
        <div class="item">J</div>
    </div>
    
</body>
</html>
