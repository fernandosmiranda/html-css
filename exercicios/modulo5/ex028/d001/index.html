<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dasafio Grid Layout</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0px;
            padding: 0px;
        }

        .container{
            width: 100%;
            height: 100vh;
            display: grid;
            grid-template-rows: 80px 40px 1fr 40px;
            grid-template-columns: 1fr 150px;
            border: 1px solid black;
            gap: 5px;
        }

        .topo{
            grid-row: 1 / 2;
            grid-column: 1 / 3;
            text-align: center;
            padding: 10px;
            border: 1px solid red;
        }

        .menu{
            grid-row: 2 / 3;
            grid-column: 1 / 3;
            text-align: center;
            padding: 10px;
            border: 1px solid blue;
        }

        .principal{
            grid-row: 3 / 4;
            grid-column: 1 / 2;
            text-align: center;
            padding: 10px;
            border: 1px solid green;
        }

        .secundario{
            grid-row: 3 / 4;
            grid-column: 2 / 3;
            text-align: center;
            padding: 10px;
            border: 1px solid darkgoldenrod;
        }

        .rodape{
            grid-row: 4 / 5;
            grid-column: 1 / 3;
            text-align: center;
            padding: 10px;
            border: 1px solid darkgoldenrod;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="topo">Topo</div>
        <div class="menu">Menu</div>
        <div class="principal">Principal</div>
        <div class="secundario">Secundário</div>
        <div class="rodape">Rodapé</div>
    </div>    
</body>
</html>
